name: Build Android APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip project files
        run: |
          unzip -o *.zip

      - name: Find Android project
        run: |
          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found!"
            echo "Files in repository:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found at: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
