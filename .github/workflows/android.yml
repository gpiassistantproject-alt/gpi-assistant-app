name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        unzip -o *.zip
        if [ -d "gpi-assistant" ]; then mv gpi-assistant/* . ; fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug -Dorg.gradle.jvmargs="--add-opens=java.base/java.lang=ALL-UNNAMED"
        else
          gradle assembleDebug -Dorg.gradle.jvmargs="--add-opens=java.base/java.lang=ALL-UNNAMED"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
